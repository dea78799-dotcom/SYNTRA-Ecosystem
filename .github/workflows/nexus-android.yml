name: NEXUS Android CI

on:
  push:
    paths:
      - "projects/syntra-nexus/**"
      - ".github/workflows/nexus-android.yml"
  pull_request:
    paths:
      - "projects/syntra-nexus/**"
      - ".github/workflows/nexus-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/syntra-nexus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
