name: NEXUS Android CI

on:
  push:
    paths:
      - "projects/syntra-nexus/**"
      - ".github/workflows/nexus-android.yml"
  pull_request:
    paths:
      - "projects/syntra-nexus/**"
      - ".github/workflows/nexus-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/syntra-nexus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

  android-instrumentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/syntra-nexus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android storage recovery tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            cd projects/syntra-nexus
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              echo "::group::Android crash buffer"
              adb logcat -b crash -d -v threadtime | tail -n 500 || true
              echo "::endgroup::"
              echo "::group::Android instrumentation and system errors"
              adb logcat -b main -b system -d -v threadtime | grep -E -i "AndroidJUnitRunner|Instrumentation|FATAL EXCEPTION|Fatal signal|Process .* died|Force finishing|ANR|crash|exception|error" | tail -n 500 || true
              echo "::endgroup::"
              echo "::group::Android test process exit information"
              adb shell dumpsys activity exit-info | tail -n 250 || true
              echo "::endgroup::"
            fi
            exit "$test_status"
