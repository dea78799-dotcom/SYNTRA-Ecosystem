name: Bug report
description: Report a reproducible problem in a SYNTRA project.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check whether the issue has already been reported.
        Do not include passwords, access tokens, private files, or personal data.
        For suspected security vulnerabilities, follow the private reporting guidance in the SYNTRA Security Policy instead of opening a public issue.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which project is affected?
      options:
        - SYNTRA Ecosystem / Documentation
        - SYNTRA OS
        - Syntra Files
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Enter the app version, build, or Git commit if known.
      placeholder: "e.g. 0.1.0 or commit SHA"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, operating system, app version, and relevant setup.
      placeholder: Describe the environment.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List clear steps that another person can safely follow.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Sometimes
        - Happened once
        - Not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots (sanitized)
      description: Remove private paths, account details, tokens, and personal information.
      placeholder: Add only safe, relevant evidence.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for existing reports.
          required: true
        - label: I removed secrets and personal information.
          required: true
        - label: This is not a public report of a security vulnerability.
          required: true
